<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Frontend Mentor | Browser extensions manager UI</title>
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-extensions.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  
</head>

<body>
  <div class="wrapper">
    <header class="header">
      <img class="logo" src="./assets/images/logo.svg" alt="Extensions" />
      <button id="theme-btn" class="theme-btn" aria-label="Switch to dark theme">
        <img id="theme-icon" src="./assets/images/icon-moon.svg" alt="" />
      </button>
    </header>

    <main>
      <div class="top-bar">
        <h1>Extensions List</h1>
        <div class="filters" role="group" aria-label="Filter extensions">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="active">Active</button>
          <button class="filter-btn" data-filter="inactive">Inactive</button>
        </div>
      </div>

      <section id="extension-list" class="grid" aria-live="polite"></section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
